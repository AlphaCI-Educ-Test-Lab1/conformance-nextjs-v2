name: AlphaCI

# Only the two long-lived branches are graded. Students branch freely to try
# things out, and those pushes cost nothing: work is checked when it is
# proposed for main or uat, not on every experiment. Without the branch
# filter a student pushing 20 commits to a scratch branch would run the whole
# seven-stage pipeline 20 times, which is the school's bill, not theirs.
#
# pull_request is filtered by TARGET branch, so a PR from any student branch
# into main or uat is checked — that is the gate branch protection makes
# mandatory, and the only path their code takes to get there.
#
# A push to a branch that also has an open pull request used to trigger BOTH
# events, running the whole pipeline twice for one commit. Restricting the PR
# trigger to these types keeps review coverage without paying for it twice.
on:
  push:
    branches: [main, uat]
  pull_request:
    branches: [main, uat]
    types: [opened, reopened, synchronize]

# Students iterating against the hidden tests push repeatedly, often within
# seconds. Without this, every superseded run completes and bills the school
# for a result nobody will read.
concurrency:
  group: alphaci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  alphaci:
    uses: Alpha-Explora/alphaci-educ-workflow/.github/workflows/pipeline-master.yml@educ-v1
    with:
      language: nextjs
      # ── CONFORMANCE HARNESS, not what a real repository looks like ─────────
      #
      # Stage 05 fetches the teacher's suite from the AlphaCI backend at
      # `{api-base-url}/ci/hidden-tests`. That backend is not deployed — the
      # host does not resolve — so in every conformance run to date the stage
      # reported "not available" and the 25% it is worth was excluded from the
      # mark. The largest single component of the grade had therefore never
      # been observed running.
      #
      # Pointing api-base-url at a static file that serves the SAME JSON
      # contract exercises the whole of stage 05 for real: the fetch, the path
      # safety checks, writing the suite into the gitignored inject directory,
      # the extraction canary, the tamper hash, running it against the
      # student's code, and scoring the result.
      #
      # What it does NOT prove is the backend's own endpoint, its authorisation
      # or its rubric — the rubric still falls back, and this run is marked
      # PROVISIONAL because of it. A real assignment leaves both of these lines
      # off and gets the real backend.
      assignment-id: conformance-demo
      # Pages, not raw.githubusercontent: raw answers 404 to any request carrying
      # an Authorization header it does not recognise, and this action always
      # sends CI_TOKEN as a Bearer. Pages ignores the header and serves the file.
      api-base-url: https://alphaci-educ-test-lab1.github.io/conformance-hidden-tests
    secrets:
      CI_TOKEN: ${{ secrets.CI_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
